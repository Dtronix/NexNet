name: Clients (golden, JavaScript, Java, interop)

# The Java and JavaScript clients and the cross-language interop rows. The C# gate stays in dotnet.yml, which has no
# Java or Node toolchain (D27). See docs/articles/contributing-multilang.md for the same commands run locally.

on:
  push:
    branches:
      - 'master'
      - 'train/**'
  pull_request:
    branches:
      - '**'  # '*' does not match '/', so PRs into branches such as train/multilang would not run
  workflow_dispatch:
  # The release pipeline in dotnet.yml runs this whole workflow as its client gate (tags and dry runs). weekly.yml runs
  # only the Android job (only-android).
  workflow_call:
    inputs:
      only-android:
        description: Run only the Android job (and the step that decides it), as the weekly drift check.
        type: boolean
        required: false
        default: false

concurrency:
  # github.workflow is the caller's name when dotnet.yml calls this workflow, so the call and a direct run of the same
  # pull request do not cancel each other.
  group: ${{ github.workflow }}-clients-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DOTNET_NOLOGO: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  # Gradle User Home cache (H29). setup-gradle only writes on the default branch by default, so train pushes never saved
  # an entry and every Gradle job resolved its whole classpath from Maven Central and the plugin portal (429 rate
  # limits). Pushes to master and train/** (and the weekly run on master) write; pull requests and tags only restore.
  # A pull request into master reads only master's cache, so it can start empty. Every Gradle command therefore runs
  # through .github/scripts/gradle-retry.sh (H35), which re-runs it once when it fails on dependency resolution.
  NEXNET_GRADLE_CACHE_READ_ONLY: ${{ github.ref != 'refs/heads/master' && !startsWith(github.ref, 'refs/heads/train/') }}

jobs:
  # Every runtime replays tests/golden (golden format v1). The C# replay runs in the dotnet job; this job checks that the
  # checked-in vectors are fresh and replays them in JavaScript and Java.
  golden:
    if: ${{ !inputs.only-android }}
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.*'

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('src/**/*.csproj', 'src/*.props', 'src/*.targets', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Golden vectors are fresh
        # Regenerates tests/golden (and the fuzz corpus derived from it) and fails when the checked-in files differ.
        shell: bash
        run: |
          dotnet run --project src/NexNet.GoldenVectors -c Release -- --out tests/golden
          if [ -n "$(git status --porcelain -- tests/golden src/NexNet.Fuzz/Corpus)" ]; then
            git status --short -- tests/golden src/NexNet.Fuzz/Corpus
            git diff --stat -- tests/golden src/NexNet.Fuzz/Corpus
            echo "::error::tests/golden is stale. Run: dotnet run --project src/NexNet.GoldenVectors -- --out tests/golden"
            exit 1
          fi

      - name: Find the golden replay tests
        id: replay
        # The JS (J02) and Java (K02) replays land with their codecs. Until then the step reports a visible notice
        # instead of failing on "no tests found".
        shell: bash
        run: |
          if git ls-files 'clients/js/packages/*/test/**' | grep -qi golden; then js=true; else js=false
            echo "::notice::No JavaScript golden replay test yet (J02); skipped."; fi
          if git ls-files 'clients/java/*/src/test/**' | grep -qi golden; then java=true; else java=false
            echo "::notice::No Java golden replay test yet (K02); skipped."; fi
          echo "js=$js" >> "$GITHUB_OUTPUT"
          echo "java=$java" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        if: steps.replay.outputs.js == 'true'
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: clients/js/package-lock.json

      - name: JavaScript golden replay
        if: steps.replay.outputs.js == 'true'
        working-directory: clients/js
        run: |
          npm ci
          npm test -- golden

      - uses: actions/setup-java@v6
        if: steps.replay.outputs.java == 'true'
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6
        if: steps.replay.outputs.java == 'true'
        with:
          cache-read-only: ${{ env.NEXNET_GRADLE_CACHE_READ_ONLY }}

      - name: Java golden replay
        if: steps.replay.outputs.java == 'true'
        run: .github/scripts/gradle-retry.sh clients/java/gradlew -p clients/java :nexnet-client:test --tests '*Golden*'

  js:
    if: ${{ !inputs.only-android }}
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    env:
      NODE_OPTIONS: --report-on-fatalerror --report-directory=${{ github.workspace }}/clients/js/test-results/node-reports
    defaults:
      run:
        working-directory: clients/js
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: clients/js/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

      - name: Unit tests (Node)
        run: npm test -- --reporter=default --reporter=junit --outputFile.junit=test-results/junit-node.xml

      # Vitest browser mode (D28/D29): the browser-relevant units in Chromium, once per workflow run.
      - name: Playwright version
        if: matrix.node == '24'
        id: playwright
        run: echo "version=$(node -p "JSON.parse(require('fs').readFileSync('node_modules/playwright/package.json', 'utf8')).version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        if: matrix.node == '24'
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium

      - name: Install Chromium
        if: matrix.node == '24' && steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Chromium system dependencies
        if: matrix.node == '24' && steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Unit tests (Chromium)
        if: matrix.node == '24'
        run: npm run test:browser -- --reporter=default --reporter=junit --outputFile.junit=test-results/junit-browser.xml

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: js-test-results-node${{ matrix.node }}
          path: |
            clients/js/test-results/
            clients/js/**/__screenshots__/
            clients/js/**/__traces__/
            !clients/js/**/node_modules/**
          if-no-files-found: ignore

  java:
    if: ${{ !inputs.only-android }}
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        # The JVM that runs the unit tests (nexnet.testJava). The build always runs on JDK 21 with --release 11.
        test-java: ['11', '21']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          # The last version listed is the default (JAVA_HOME); JDK 11 is a Gradle toolchain via JAVA_HOME_11_X64.
          java-version: |
            11
            21

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ env.NEXNET_GRADLE_CACHE_READ_ONLY }}

      - name: gradlew check (unit tests, golden vectors, javadoc, Animal Sniffer API 24)
        run: >-
          .github/scripts/gradle-retry.sh clients/java/gradlew -p clients/java check --continue
          -Pnexnet.testJava=${{ matrix.test-java }}
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME_11_X64,JAVA_HOME_21_X64

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: java-test-results-jdk${{ matrix.test-java }}
          path: |
            clients/java/**/build/test-results/
            clients/java/**/build/reports/
          if-no-files-found: ignore

  # D27: the SDK-gated Generator tests compile and run what the generator emits for Java and JavaScript (javac
  # --release 11 -Werror, tsc strict with checkJs): JavaCompileTests, JavaScaffoldingCompileTests, JsCompileTests,
  # JsProxyCompileTests, JsScaffoldingCompileTests, the EmittedRuntimeTests proofs and H25's DocSampleTests (the samples
  # of docs/articles/java-client.md and javascript-client.md). dotnet.yml hides both toolchains, so there they skip.
  # NEXNET_REQUIRE_SDKS turns a missing tool into a failure, and the last step fails on any skipped test, so a PR that
  # breaks generated Java or JavaScript compilation fails here.
  generator-sdks:
    if: ${{ !inputs.only-android }}
    runs-on: ubuntu-26.04
    env:
      NEXNET_REQUIRE_SDKS: '1'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.*'

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('src/**/*.csproj', 'src/*.props', 'src/*.targets', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: clients/js/package-lock.json

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # The tests build the nexnet-client jar with the wrapper (and read JSpecify from the Gradle cache).
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ env.NEXNET_GRADLE_CACHE_READ_ONLY }}

      - name: Install the TypeScript compiler
        run: npm ci --prefix clients/js

      - name: Build the nexnet-client jar
        run: .github/scripts/gradle-retry.sh clients/java/gradlew -p clients/java :nexnet-client:jar

      # --minimum-expected-tests guards against discovering fewer tests; raise it when tests are added.
      - name: Generator tests with javac and tsc (NEXNET_REQUIRE_SDKS=1)
        run: >-
          dotnet test src/NexNet.Generator.Tests -c Release --minimum-expected-tests 606
          --results-directory TestResults -- --report-trx

      - name: No test skipped
        # Every skip in this suite is an SDK gate, so with the SDKs installed nothing may be skipped.
        shell: bash
        run: |
          counters=$(grep -ho '<Counters [^>]*>' TestResults/*.trx)
          echo "$counters"
          if echo "$counters" | grep -qv 'notExecuted="0"'; then
            echo "::error::Generator tests were skipped with NEXNET_REQUIRE_SDKS=1; an SDK-gated check did not run."
            exit 1
          fi

      # K37/K38: the runtime in the form the generator emits it (D31), compiled as a consumer gets it. emittedConsumerTest
      # (part of gradlew check) compiles the core runtime and generated code with nothing on the class path, and the
      # kotlin, okhttp and micrometer modules against their own libraries, with warnings as errors. It is skipped when
      # the sample was never built, so this job builds it with those modules and fails if the task did not run. The
      # android module needs the Android SDK and is compiled by the android job below.
      - name: Emit the runtime with the JVM optional modules
        shell: bash
        run: |
          dotnet build src/NexNet.Generator.IntegrationSample -c Release "-p:NexNetJavaEmitRuntimeModules=kotlin%3Bokhttp%3Bmicrometer"
          out=src/NexNet.Generator.IntegrationSample/generated/java/com/dtronix/nexnet
          for f in NexusRuntime.java kotlin okhttp micrometer; do
            test -e "$out/$f" || { echo "::error::The integration sample did not emit $out/$f."; exit 1; }
          done

      - name: Compile the emitted runtime and modules (emittedConsumerTest)
        shell: bash
        run: |
          log="$RUNNER_TEMP/emitted-consumer-test.log"
          .github/scripts/gradle-retry.sh clients/java/gradlew -p clients/java :nexnet-client:emittedConsumerTest --console=plain 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then exit "$status"; fi
          if ! grep -Eq '^> Task :nexnet-client:emittedConsumerTest$' "$log"; then
            grep -E 'emittedConsumerTest' "$log" || true
            echo "::error:::nexnet-client:emittedConsumerTest did not run (skipped or up to date); the emitted modules were not compiled."
            exit 1
          fi

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: generator-sdks-results
          path: TestResults/
          if-no-files-found: ignore

  # Bucket-A interop rows (D23/D24) against each language host. Every row is required: a failing interop test fails
  # the job. The matrix generates only the rows a language can run (H55), and the java job also runs every WebSocket
  # and WebSocketTls row on the OkHttp connector of nexnet-client-okhttp (the java/WebSocket(okhttp) variant rows). The
  # test session writes a coverage report (NEXNET_MATRIX_REPORT) and fails on a skipped row whose reason cites no card.
  interop:
    if: ${{ !inputs.only-android }}
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        lang: [node, java, browser-chromium]
    env:
      NEXNET_TEST_LANGS: ${{ matrix.lang }}
      NEXNET_REQUIRE_SDKS: '1'
      NEXNET_MATRIX_REPORT: ${{ github.workspace }}/artifacts/matrix-coverage
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'recursive'

      - name: Install msquic
        run: sudo apt-get update && sudo apt-get install -y libmsquic

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.*'

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('src/**/*.csproj', 'src/*.props', 'src/*.targets', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - uses: actions/setup-node@v7
        if: matrix.lang != 'java'
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: clients/js/package-lock.json

      - uses: actions/setup-java@v6
        if: matrix.lang == 'java'
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6
        if: matrix.lang == 'java'
        with:
          cache-read-only: ${{ env.NEXNET_GRADLE_CACHE_READ_ONLY }}

      - name: Build the C# side
        run: dotnet build src -c Release --maxcpucount:1

      # The host build commands are fixed by docs/internals/interop-control-protocol.md §10.
      - name: Build the Node/browser host
        if: matrix.lang != 'java'
        run: |
          npm ci --prefix clients/js
          npm run build:interop-host --prefix clients/js

      - name: Install Chromium
        if: matrix.lang == 'browser-chromium'
        working-directory: clients/js
        run: npx playwright install --with-deps chromium

      - name: Build the JVM host
        if: matrix.lang == 'java'
        run: .github/scripts/gradle-retry.sh clients/java/gradlew -p clients/java :interop-host:installInteropHost

      - name: Interop tests (${{ matrix.lang }}; HttpSocketTls and WebSocketTls)
        id: tests
        env:
          NODE_OPTIONS: --report-on-fatalerror --report-uncaught-exception --report-directory=${{ github.workspace }}/artifacts/interop/node-reports
        run: >-
          dotnet test src/NexNet.IntegrationTests -c Release --no-build --results-directory TestResults
          --treenode-filter "/*/*/*/*[Lang=${{ env.NEXNET_TEST_LANGS }}]"
          -- --report-trx

      # H55: the coverage report of the matrix (MatrixCoverage) as the step summary and an artifact. The test session
      # already failed on an uncited skip; this step says so again in the summary, and fails when no report was written.
      - name: Matrix coverage report
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        shell: bash
        run: |
          report="$NEXNET_MATRIX_REPORT"
          if [ ! -f "$report/matrix-coverage.json" ]; then
            echo "::error::The test session wrote no matrix coverage report to $report."
            exit 1
          fi
          cat "$report/matrix-coverage.md" >> "$GITHUB_STEP_SUMMARY"
          uncited=$(jq '.uncitedSkips' "$report/matrix-coverage.json")
          if [ "$uncited" != "0" ]; then
            echo "::error::$uncited matrix row(s) were skipped for a reason that cites no card; see the step summary."
            exit 1
          fi

      - name: Upload the matrix coverage report
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: matrix-coverage-${{ matrix.lang }}
          path: artifacts/matrix-coverage/
          if-no-files-found: ignore

      - name: Upload interop results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: interop-results-${{ matrix.lang }}
          # TRX (thread dumps and stderr tails of crashed hosts are in the failure messages), control transcripts,
          # host logs, Node reports and Playwright traces. Generated host code is left out.
          path: |
            TestResults/
            /tmp/nexnet-interop-transcripts/
            artifacts/interop/
            !artifacts/interop/*/generated/**
          if-no-files-found: ignore

  # H30: whether the android job runs. It is slow (an emulator boot), so a pull request or push runs it only when it
  # changes the Java client, the generator (the Java target and the embedded runtime), the interop server or test
  # nexuses the smoke test uses, or this workflow. workflow_dispatch, the release gate (a tag, or dotnet.yml's dry run on
  # workflow_dispatch) and weekly.yml always run it. A plain git diff, not a paths-filter action: dotnet.yml calls this
  # workflow with contents: read only, so the job cannot ask for pull-requests: read.
  android-changes:
    runs-on: ubuntu-26.04
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          # A pull request checks out its merge commit, whose first parent is the base: depth 2 holds both. A push
          # needs the commit before it, which can be any depth back.
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 0 }}

      - name: Does the change touch the Android paths?
        id: decide
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          paths=(clients/java src/NexNet.Generator src/NexNet.InteropServer src/NexNet.TestNexus .github/workflows/clients.yml)
          if [ "$EVENT" = pull_request ]; then
            base=HEAD^1
          elif [ "$EVENT" = push ] && [[ "$GITHUB_REF" != refs/tags/* ]] && [ -n "$BEFORE" ] \
              && [ "$BEFORE" != 0000000000000000000000000000000000000000 ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            base=$BEFORE
          else
            # workflow_dispatch, schedule (weekly.yml), a tag, or a push that creates a branch: always run.
            echo "::notice::Android job runs: $EVENT on $GITHUB_REF."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$base" HEAD -- "${paths[@]}")
          if [ -n "$changed" ]; then
            echo "Android paths changed:"
            echo "$changed"
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No change under ${paths[*]}; Android job skipped."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  # D26: the only place the Android SDK is used. Builds the -android AAR (K13), dexes the core JAR at --min-api 24 with
  # D8 and R8, compiles the runtime and every optional module in the form the generator emits them (K37) and dexes
  # that form at --min-api 24 (K38), and smoke-tests on an API-24 emulator against the interop server, reachable from
  # it at 10.0.2.2: connect, invoke and pipe echo through the generated client of the interop test nexus (K36). A second
  # emulator at API 26 runs the java.time device test, which API 24 skips (K47).
  # Runs when android-changes says so (H30); weekly.yml also runs it on master as a drift check (only-android).
  android:
    needs: android-changes
    if: needs.android-changes.outputs.run == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    env:
      ANDROID_BUILD_TOOLS: '35.0.0'
      # compileSdk of nexnet-client-android. Installed up front so the build does not depend on the Android Gradle
      # plugin downloading it.
      ANDROID_COMPILE_SDK: '36'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ env.NEXNET_GRADLE_CACHE_READ_ONLY }}

      - uses: android-actions/setup-android@v4

      - name: Install the API 24 and compile SDK platforms and build tools
        run: sdkmanager --install "platforms;android-24" "platforms;android-${ANDROID_COMPILE_SDK}" "build-tools;${ANDROID_BUILD_TOOLS}"

      - name: Build the core JAR
        run: .github/scripts/gradle-retry.sh clients/java/gradlew -p clients/java :nexnet-client:jar

      - name: D8 and R8 at --min-api 24
        shell: bash
        run: |
          jar=$(ls clients/java/nexnet-client/build/libs/nexnet-client*.jar | grep -v -e sources -e javadoc | head -n 1)
          tools="$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS"
          android_jar="$ANDROID_HOME/platforms/android-24/android.jar"
          echo "Dexing $jar"
          mkdir -p "$RUNNER_TEMP/d8" "$RUNNER_TEMP/r8"
          "$tools/d8" --release --min-api 24 --lib "$android_jar" --output "$RUNNER_TEMP/d8" "$jar"
          # R8 fails on a reference to a class or member that API 24 lacks. JSpecify annotations are compile-only.
          printf '%s\n' '-keep class com.dtronix.nexnet.** { *; }' '-dontwarn org.jspecify.**' > "$RUNNER_TEMP/keep.pro"
          java -cp "$tools/lib/d8.jar" com.android.tools.r8.R8 --release --min-api 24 --lib "$android_jar" \
            --pg-conf "$RUNNER_TEMP/keep.pro" --output "$RUNNER_TEMP/r8" "$jar"
          ls -l "$RUNNER_TEMP/d8" "$RUNNER_TEMP/r8"

      - name: Does the Android module exist yet?
        id: module
        shell: bash
        run: |
          if [ -d clients/java/nexnet-client-android ]; then aar=true; else aar=false
            echo "::notice::nexnet-client-android does not exist yet (K13); AAR build and emulator smoke test skipped."; fi
          if [ -d clients/java/nexnet-client-android/src/androidTest ]; then smoke=true; else smoke=false; fi
          echo "aar=$aar" >> "$GITHUB_OUTPUT"
          echo "smoke=$smoke" >> "$GITHUB_OUTPUT"

      - name: Build the AAR
        if: steps.module.outputs.aar == 'true'
        run: .github/scripts/gradle-retry.sh clients/java/gradlew -p clients/java :nexnet-client-android:assembleRelease

      - uses: actions/setup-dotnet@v6
        if: steps.module.outputs.aar == 'true'
        with:
          dotnet-version: '10.*'

      # K37: the generator emits the runtime and the listed modules into the integration sample's Java output (D31).
      # emittedConsumerTest compiles them in a consumer build: core and generated code alone, kotlin, okhttp and
      # micrometer against their libraries, and with -Pnexnet.emittedConsumer.android=true the core plus the android
      # module in an Android library build. The Android Gradle plugin does not work in the nested build of
      # :nexnet-client:emittedConsumerTest, so this runs the consumer build on its own (K39).
      - name: Emit the runtime with every optional module
        if: steps.module.outputs.aar == 'true'
        shell: bash
        run: |
          dotnet build src/NexNet.Generator.IntegrationSample -c Release "-p:NexNetJavaEmitRuntimeModules=android%3Bkotlin%3Bokhttp%3Bmicrometer"
          test -f src/NexNet.Generator.IntegrationSample/generated/java/com/dtronix/nexnet/android/NexusAndroid.java

      - name: Compile the emitted runtime and modules (JVM and Android)
        if: steps.module.outputs.aar == 'true'
        shell: bash
        # Its root project is emitted-consumer-test, so clients/java/gradle.properties does not apply (K39 watch item):
        # the H29 download retries are passed here.
        run: >-
          .github/scripts/gradle-retry.sh clients/java/gradlew -p clients/java/nexnet-client/emitted-consumer-test consumerCheck
          "-Pnexnet.emitted.dir=$GITHUB_WORKSPACE/src/NexNet.Generator.IntegrationSample/generated/java"
          -Pnexnet.emittedConsumer.android=true
          -Dorg.gradle.internal.repository.max.tentatives=6 -Dorg.gradle.internal.repository.initial.backoff=2000
          -Dorg.gradle.internal.network.retry.max.attempts=6 -Dorg.gradle.internal.network.retry.initial.backOff=2000

      # K38: the emitted core runtime (Nullness=none: no JSpecify) and android module, as the consumer build's AAR holds
      # them, dexed at --min-api 24 the way an app build does.
      - name: D8 the emitted runtime and android module at --min-api 24
        if: steps.module.outputs.aar == 'true'
        shell: bash
        run: |
          aar=$(ls clients/java/nexnet-client/emitted-consumer-test/android/build/outputs/aar/*-release.aar | head -n 1)
          tools="$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS"
          android_jar="$ANDROID_HOME/platforms/android-24/android.jar"
          mkdir -p "$RUNNER_TEMP/emitted-aar" "$RUNNER_TEMP/emitted-d8"
          unzip -o -q "$aar" classes.jar -d "$RUNNER_TEMP/emitted-aar"
          echo "Dexing classes.jar of $aar"
          "$tools/d8" --release --min-api 24 --lib "$android_jar" --output "$RUNNER_TEMP/emitted-d8" "$RUNNER_TEMP/emitted-aar/classes.jar"
          ls -l "$RUNNER_TEMP/emitted-d8"

      # Builds src/NexNet.TestNexus too: the generator writes the Java client of the interop test nexus, which the
      # device tests compile, to artifacts/interop/java/generated.
      - name: Build the interop server
        if: steps.module.outputs.smoke == 'true'
        run: dotnet build src/NexNet.InteropServer/Cli -c Release

      - name: Start the interop server
        if: steps.module.outputs.smoke == 'true'
        # Prints "<endpoint> <address>" per endpoint. Addresses use 127.0.0.1; the emulator reaches the host's loopback
        # at 10.0.2.2. They become instrumentation arguments nexnet.endpoint.<name>, plus nexnet.token.
        shell: bash
        run: |
          log="$RUNNER_TEMP/interop-server.log"
          nohup dotnet run --project src/NexNet.InteropServer/Cli -c Release --no-build -- --token android-smoke > "$log" 2>&1 &
          for _ in $(seq 1 180); do grep -q '^Running' "$log" && break; sleep 1; done
          grep -q '^Running' "$log" || { cat "$log"; echo "::error::The interop server did not start."; exit 1; }
          cat "$log"
          args="-Pandroid.testInstrumentationRunnerArguments.nexnet.token=android-smoke"
          while read -r name address; do
            case "$name" in Running*|test-ca|"") continue ;; esac
            args="$args -Pandroid.testInstrumentationRunnerArguments.nexnet.endpoint.$name=${address//127.0.0.1/10.0.2.2}"
          done < "$log"
          echo "NEXNET_ANDROID_ARGS=$args" >> "$GITHUB_ENV"

      - name: Enable KVM
        if: steps.module.outputs.smoke == 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Writes the checker the "Device test results" steps run. connectedCheck prints no test counts, and the smoke tests
      # skip themselves without the endpoint arguments, so a broken argument hand-off would still pass: the checker lists
      # every device test of one emulator run and fails if none ran, one failed, or a required class did not run and pass.
      # Arguments: results directory, API level, required test class (simple name).
      - name: Write the device test results checker
        if: steps.module.outputs.smoke == 'true'
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/device-results.py" <<'EOF'
          import glob, os, sys
          import xml.etree.ElementTree as ET
          results, api, required = sys.argv[1], sys.argv[2], sys.argv[3]
          files = glob.glob(os.path.join(results, '**', '*.xml'), recursive=True)
          cases = [c for f in files for c in ET.parse(f).getroot().iter('testcase')]
          def state(c):
              return 'failed' if c.find('failure') is not None or c.find('error') is not None else 'skipped' if c.find('skipped') is not None else 'passed'
          for c in cases:
              print(f"  {state(c):7} {c.get('classname')}.{c.get('name')} ({c.get('time')} s)")
          count = lambda cs, s: sum(1 for c in cs if state(c) == s)
          req = [c for c in cases if c.get('classname', '').endswith('.' + required)]
          line = (f"Device tests on the API {api} emulator: {len(cases)} ({count(cases, 'passed')} passed, {count(cases, 'failed')} failed, "
                  f"{count(cases, 'skipped')} skipped); {required}: {len(req)} ({count(req, 'passed')} passed)")
          print(line)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(line + '\n')
          if not cases:
              sys.exit(f'::error::No device test results on API {api} ({results}).')
          if count(cases, 'failed'):
              sys.exit(f'::error::{count(cases, "failed")} device test(s) failed on API {api}.')
          if not req or count(req, 'passed') != len(req):
              sys.exit(f'::error::{required} did not run and pass on API {api} (skipped, or endpoint arguments missing?).')
          EOF

      - name: Smoke test on an API 24 emulator (connect, invoke, pipe)
        if: steps.module.outputs.smoke == 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 24
          arch: x86_64
          target: default
          avd-name: nexnet-api24
          disable-animations: true
          script: .github/scripts/gradle-retry.sh clients/java/gradlew -p clients/java :nexnet-client-android:connectedCheck $NEXNET_ANDROID_ARGS

      # Moved out of the build directory so the API 26 run below cannot mix with or replace them.
      - name: Device test results (API 24)
        if: steps.module.outputs.smoke == 'true' && !cancelled()
        shell: bash
        run: |
          dest="$RUNNER_TEMP/device-results/api24"
          mkdir -p "$dest"
          src=clients/java/nexnet-client-android/build/outputs/androidTest-results/connected
          if [ -d "$src" ]; then mv "$src"/* "$dest"/ 2>/dev/null || true; fi
          python3 "$RUNNER_TEMP/device-results.py" "$dest" 24 InteropServerSmokeTest

      # K47: java.time is API 26 (without desugaring), so NexusJavaTimeDeviceTest (@SdkSuppress(minSdkVersion = 26)) is
      # skipped on API 24. A second emulator at API 26 runs that class only; everything else stays on API 24.
      - name: java.time device test on an API 26 emulator
        if: steps.module.outputs.smoke == 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 26
          arch: x86_64
          target: default
          avd-name: nexnet-api26
          disable-animations: true
          script: .github/scripts/gradle-retry.sh clients/java/gradlew -p clients/java :nexnet-client-android:connectedCheck -Pandroid.testInstrumentationRunnerArguments.class=com.dtronix.nexnet.android.NexusJavaTimeDeviceTest

      - name: Device test results (API 26)
        if: steps.module.outputs.smoke == 'true' && !cancelled()
        shell: bash
        run: |
          dest="$RUNNER_TEMP/device-results/api26"
          mkdir -p "$dest"
          src=clients/java/nexnet-client-android/build/outputs/androidTest-results/connected
          if [ -d "$src" ]; then mv "$src"/* "$dest"/ 2>/dev/null || true; fi
          python3 "$RUNNER_TEMP/device-results.py" "$dest" 26 NexusJavaTimeDeviceTest

      - name: Upload Android results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-results
          path: |
            ${{ runner.temp }}/interop-server.log
            ${{ runner.temp }}/device-results/
            clients/java/**/build/outputs/androidTest-results/
            clients/java/**/build/reports/
          if-no-files-found: ignore
