name: Build, Pack & Publish

on:
  push:
    branches:
      - 'master'
    tags:
      - 'v*'
  pull_request:
    branches:
      - '*'

jobs:
  # Experiment: the legacy MemoryPack payload backend must keep passing until the go/no-go decision.
  memorypack-backend:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install msquic
      run: sudo apt-get update && sudo apt-get install -y libmsquic

    - name: Install .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.*'

    - name: Build (MemoryPack payloads)
      run: dotnet build src -c Release --maxcpucount:1 -p:NexNetSerializer=MemoryPack

    - name: Execute integration tests (MemoryPack payloads)
      run: dotnet test src/NexNet.IntegrationTests -c Release --no-build -p:NexNetSerializer=MemoryPack

    - name: Execute generator tests (MemoryPack payloads)
      run: dotnet test src/NexNet.Generator.Tests -c Release --no-build -p:NexNetSerializer=MemoryPack

  build:
    runs-on: ubuntu-latest
                             
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: 'recursive'

    - name: Install msquic
      run: sudo apt-get update && sudo apt-get install -y libmsquic

    - name: Install .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.*'
        source-url: https://api.nuget.org/v3/index.json
      env:
        NUGET_AUTH_TOKEN: ${{secrets.GITHUB_TOKEN}}

    - name: Build
      run: dotnet build src -c Release --maxcpucount:1

    - name: Validate AOT compatibility
      # The MessagePack payload backend has no third-party serializer, so no upstream trim/AOT warnings are suppressed.
      run: dotnet build src/Samples/NexNetSample.Aot.Client -c Release --no-restore -p:TreatWarningsAsErrors=true

    - name: Execute integration tests
      run: dotnet test src/NexNet.IntegrationTests -c Release --no-build -v=normal

    - name: Execute generator tests
      run: dotnet test src/NexNet.Generator.Tests -c Release --no-build -v=normal

    - name: Execute serialization tests (includes fuzz harness smoke run)
      run: dotnet test src/NexNet.Serialization.Tests -c Release --no-build -v=normal
      
    - name: Pack NexNet
      run: dotnet pack src/NexNet -c Release -o ./artifacts --maxcpucount:1

    - name: Pack NexNet.Quic
      run: dotnet pack src/NexNet.Quic -c Release -o ./artifacts --maxcpucount:1

    - name: Pack NexNet.Asp
      run: dotnet pack src/NexNet.Asp -c Release -o ./artifacts --maxcpucount:1
      
    - name: Pack NexNet.Generator
      run: dotnet pack src/NexNet.Generator -c Release -o ./artifacts --maxcpucount:1
      
    - name: Export artifacts
      uses: actions/upload-artifact@v4
      with:
        path: artifacts/*
        
    - name: Create release
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        name: "NexNet ${{ github.ref_name }} Released"
        files: |
          artifacts/*.nupkg
          artifacts/*.snupkg
      
    - name: Push NuGet packages
      if: startsWith(github.ref, 'refs/tags/')
      run: dotnet nuget push artifacts/**/*.nupkg --api-key ${{ secrets.ORG_NUGET_AUTH_TOKEN }} --skip-duplicate
