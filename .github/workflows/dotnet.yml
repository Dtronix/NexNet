name: Build, Pack & Publish

# The C# gate on every push and pull request, and the release pipeline (llm-release.md) on a vX.Y.Z tag.
#
# NuGet is the only release channel (D30). A tag runs the full gate (the C# gate below plus every job of clients.yml:
# golden vectors, JavaScript, Java, doc samples and interop), packs the four NuGet packages, checks them with
# .github/scripts/release-guard.ps1 (lockstep version; NexNet.Generator embeds the current Java/JS runtime, D31) and
# pushes them to nuget.org. The JavaScript (npm pack tarball) and Java (jars) clients are uploaded as workflow artifacts
# only: nothing is published to npm or to a Maven repository, and no npm or Maven secret exists.
#
# A dry run (everything except the GitHub release and the NuGet push) runs on workflow_dispatch and on a pull request
# that changes the release pipeline (see the release-guard job). The NuGet push stays in this file: the nuget.org
# trusted-publishing policy names it.

on:
  push:
    branches:
      - 'master'
    tags:
      - 'v*'
  pull_request:
    branches:
      - '**'  # '*' does not match '/', so PRs into branches such as train/multilang never ran CI
  workflow_dispatch:

concurrency:
  # A new push to a PR cancels its older run; master and tag runs are never cancelled.
  group: dotnet-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Gradle User Home cache (H29). setup-gradle only writes on the default branch by default, so train pushes never saved
  # an entry and every Gradle job resolved its whole classpath from Maven Central and the plugin portal (429 rate
  # limits). Pushes to master and train/** (and the weekly run on master) write; pull requests and tags only restore.
  # A pull request into master reads only master's cache, so it can start empty. Every Gradle command therefore runs
  # through .github/scripts/gradle-retry.sh (H35), which re-runs it once when it fails on dependency resolution.
  NEXNET_GRADLE_CACHE_READ_ONLY: ${{ github.ref != 'refs/heads/master' && !startsWith(github.ref, 'refs/heads/train/') }}

jobs:
  # Runs first on every event: lockstep versions and no npm or Maven publish path (D30). It also decides whether this
  # run is a release (tag), a dry run (workflow_dispatch, or a pull request touching the release pipeline) or neither.
  release-guard:
    runs-on: ubuntu-26.04
    outputs:
      pipeline: ${{ steps.scope.outputs.pipeline }}
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 2  # a pull request's merge commit and its base parent

    - name: Release guard
      shell: pwsh
      run: ./.github/scripts/release-guard.ps1 ${{ startsWith(github.ref, 'refs/tags/') && format('-Tag {0}', github.ref_name) || '' }}

    - name: Release notes page (tag only)
      # The release body comes from docs/articles/releases/release-notes-<tag>.md; a tag without one fails here,
      # before the gate runs.
      if: startsWith(github.ref, 'refs/tags/')
      run: python3 .github/scripts/release-notes.py "${{ github.ref_name }}" release-body.md

    - name: Release or dry run?
      id: scope
      shell: bash
      run: |
        pipeline=false
        case "${{ github.event_name }}" in
          workflow_dispatch) pipeline=true ;;
          push) [[ "${{ github.ref }}" == refs/tags/* ]] && pipeline=true ;;
          pull_request)
            # The merge commit's first parent is the base branch, so this lists the pull request's changes.
            if git diff --name-only HEAD^1 HEAD | grep -qE '^(\.github/workflows/(dotnet|clients)\.yml|\.github/scripts/release-|clients/js/package(-lock)?\.json|clients/js/packages/[^/]+/package\.json|clients/java/(build-logic/|settings\.gradle\.kts|gradle\.properties|[^/]+/build\.gradle\.kts)|src/NexNet(\.Asp|\.Quic|\.Generator)?/[^/]+\.csproj$|src/NexNet\.props$|llm-release\.md$)'; then
              pipeline=true
              echo "::notice::This pull request changes the release pipeline: running it as a dry run (no GitHub release, no NuGet push)."
            fi ;;
        esac
        echo "pipeline=$pipeline" >> "$GITHUB_OUTPUT"

  # The C# gate (D27): it builds and tests src/ with no Java or JavaScript toolchain reachable. Java and JS run in
  # clients.yml; the cross-language interop rows run there too.
  build:
    runs-on: ubuntu-26.04

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
        submodules: 'recursive'

    - name: Install msquic
      run: sudo apt-get update && sudo apt-get install -y libmsquic

    - name: Install .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.*'

    - name: Cache NuGet packages
      uses: actions/cache@v6
      with:
        path: ~/.nuget/packages
        key: nuget-${{ runner.os }}-${{ hashFiles('src/**/*.csproj', 'src/*.props', 'src/*.targets', 'global.json') }}
        restore-keys: nuget-${{ runner.os }}-

    - name: Block Java and JavaScript toolchains (D27)
      # The runner image ships Node and JDKs. These shims come first on PATH for every later step, so any attempt by
      # dotnet build or dotnet test to run one fails the job loudly instead of quietly depending on it. (JavaScript
      # actions such as upload-artifact run on the runner's own Node by absolute path and are not affected.)
      shell: bash
      run: |
        shims="$RUNNER_TEMP/d27-shims"
        mkdir -p "$shims"
        for tool in node npm npx java javac jar jcmd gradle tsc; do
          printf '#!/bin/sh\necho "D27 violation: %s was invoked during the C# gate." >&2\nexit 127\n' "$tool" > "$shims/$tool"
          chmod +x "$shims/$tool"
        done
        echo "$shims" >> "$GITHUB_PATH"
        echo "JAVA_HOME=" >> "$GITHUB_ENV"

    - name: Build
      run: dotnet build src -c Release --maxcpucount:1

    - name: Native AOT publish (zero trim/AOT warnings)
      # A real ILCompiler run: `dotnet build` does not run the AOT analysis, so warnings only surface on publish.
      # TreatWarningsAsErrors comes from src/Directory.Build.props. The final grep is the dependable check,
      # because some ILCompiler warnings bypass TreatWarningsAsErrors.
      # `shell: bash` runs with pipefail, so a failed publish is not hidden by tee.
      shell: bash
      run: |
        dotnet publish src/Samples/NexNetSample.Aot.Client -c Release -r linux-x64 -o ./aot-out \
          -p:WarningsAsErrors=IL2026%3BIL2046%3BIL2055%3BIL2057%3BIL2067%3BIL2070%3BIL2072%3BIL2075%3BIL2080%3BIL2087%3BIL2091%3BIL2104%3BIL3050%3BIL3051%3BIL3053 \
          2>&1 | tee aot.log
        ! grep -E "warning IL[0-9]+" aot.log

    # Tests run on Microsoft.Testing.Platform (global.json). --minimum-expected-tests guards against a suite silently
    # discovering fewer tests; raise each count when tests are added. --results-directory goes before `--` so dotnet test
    # resolves it against the repo root rather than the test process's working directory.
    - name: Execute integration tests
      run: dotnet test src/NexNet.IntegrationTests -c Release --no-build --minimum-expected-tests 2859 --results-directory TestResults -- --report-trx

    - name: Execute generator tests
      run: dotnet test src/NexNet.Generator.Tests -c Release --no-build --minimum-expected-tests 606 --results-directory TestResults -- --report-trx

    - name: Execute serialization tests (includes fuzz harness smoke run and golden freshness)
      run: dotnet test src/NexNet.Serialization.Tests -c Release --no-build --minimum-expected-tests 298 --results-directory TestResults -- --report-trx

    - name: Execute interop harness tests
      run: dotnet test src/NexNet.Interop.Tests -c Release --no-build --minimum-expected-tests 42 --results-directory TestResults -- --report-trx

    - name: Execute interop harness self-tests (C# in-proc driver)
      run: dotnet test src/NexNet.Interop/SelfTest -c Release --no-build --minimum-expected-tests 25 --results-directory TestResults -- --report-trx

    - name: Execute interop server self-tests
      run: dotnet test src/NexNet.InteropServer/SelfTest -c Release --no-build --minimum-expected-tests 7 --results-directory TestResults -- --report-trx

    - name: Upload test results
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: test-results
        path: TestResults/*.trx
        if-no-files-found: ignore
      
    - name: Pack NexNet
      run: dotnet pack src/NexNet -c Release -o ./artifacts --maxcpucount:1

    - name: Pack NexNet.Quic
      run: dotnet pack src/NexNet.Quic -c Release -o ./artifacts --maxcpucount:1

    - name: Pack NexNet.Asp
      run: dotnet pack src/NexNet.Asp -c Release -o ./artifacts --maxcpucount:1
      
    - name: Pack NexNet.Generator
      run: dotnet pack src/NexNet.Generator -c Release -o ./artifacts --maxcpucount:1
      
    - name: Export NuGet packages
      uses: actions/upload-artifact@v7
      with:
        name: nuget-packages
        path: artifacts/*
        if-no-files-found: error

  # ---- Release pipeline: tag, workflow_dispatch, or a pull request that changes the pipeline (dry run) ----------------

  # The full client gate: golden vectors, JavaScript, Java, doc samples and interop (clients.yml).
  clients:
    needs: release-guard
    if: needs.release-guard.outputs.pipeline == 'true'
    uses: ./.github/workflows/clients.yml

  # The JavaScript and Java clients at the release version, as workflow artifacts only (D30). Consumers get the runtime
  # from NexNet.Generator (D31); these are for inspection and manual use.
  client-artifacts:
    needs: release-guard
    if: needs.release-guard.outputs.pipeline == 'true'
    runs-on: ubuntu-26.04
    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - uses: actions/setup-node@v7
      with:
        node-version: '24'

    - uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: '21'

    - uses: gradle/actions/setup-gradle@v6
      with:
        cache-read-only: ${{ env.NEXNET_GRADLE_CACHE_READ_ONLY }}

    - name: JavaScript client tarball (npm pack; never published)
      run: |
        mkdir -p client-artifacts/js
        npm pack ./clients/js/packages/nexnet --pack-destination client-artifacts/js

    - name: Java client jars (never published)
      shell: bash
      run: |
        .github/scripts/gradle-retry.sh clients/java/gradlew -p clients/java \
          :nexnet-client:assemble :nexnet-client-kotlin:assemble :nexnet-client-okhttp:assemble :nexnet-client-micrometer:assemble
        mkdir -p client-artifacts/java
        cp clients/java/nexnet-client*/build/libs/*.jar client-artifacts/java/
        ls -l client-artifacts/js client-artifacts/java

    - name: Upload the JavaScript client
      uses: actions/upload-artifact@v7
      with:
        name: javascript-client
        path: client-artifacts/js/*.tgz
        if-no-files-found: error

    - name: Upload the Java client
      uses: actions/upload-artifact@v7
      with:
        name: java-client
        path: client-artifacts/java/*.jar
        if-no-files-found: error

  # The packed NuGet packages: lockstep version, and NexNet.Generator embeds the current Java/JS runtime (D31).
  verify-packages:
    needs: [release-guard, build]
    if: needs.release-guard.outputs.pipeline == 'true'
    runs-on: ubuntu-26.04
    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Download the NuGet packages
      uses: actions/download-artifact@v8
      with:
        name: nuget-packages
        path: artifacts

    - name: Check the packages
      shell: pwsh
      run: ./.github/scripts/release-guard.ps1 -PackageDirectory artifacts ${{ startsWith(github.ref, 'refs/tags/') && format('-Tag {0}', github.ref_name) || '' }}

  # Tag only: the GitHub release and the NuGet push, after every gate above has passed.
  publish:
    needs: [release-guard, build, clients, client-artifacts, verify-packages]
    if: startsWith(github.ref, 'refs/tags/') && needs.release-guard.outputs.pipeline == 'true'
    runs-on: ubuntu-26.04
    permissions:
      contents: write  # create the GitHub release
      id-token: write  # GitHub OIDC token for NuGet trusted publishing
    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Download the NuGet packages
      uses: actions/download-artifact@v8
      with:
        name: nuget-packages
        path: artifacts

    - name: Install .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.*'

    - name: Release notes
      run: python3 .github/scripts/release-notes.py "${{ github.ref_name }}" release-body.md

    - name: Create release
      uses: softprops/action-gh-release@v3
      with:
        name: "NexNet ${{ github.ref_name }} Released"
        body_path: release-body.md
        files: |
          artifacts/*.nupkg
          artifacts/*.snupkg

    - name: NuGet login (OIDC → temp API key)
      uses: NuGet/login@v1
      id: nuget-login
      with:
        user: ${{ secrets.NUGET_USER }}

    - name: Push NuGet packages
      run: dotnet nuget push artifacts/*.nupkg --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
