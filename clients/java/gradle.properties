org.gradle.configuration-cache=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.jvmargs=-Xmx1g -Dfile.encoding=UTF-8

# Java version of the JVM that runs the unit tests (11 or 21). The code always compiles with JDK 21 and --release 11.
nexnet.testJava=21

# Dependency downloads (H29). Gradle retries a timeout, a 5xx, 408 or 429 (Maven Central and the plugin portal rate
# limit CI runners) with doubling back-off. The defaults are 3 attempts from 1 s (about 3 s in all), too short to ride
# out a 429; 6 attempts from 2 s wait about a minute before the repository is given up for the build.
# repository.*: module metadata and artifact resolution; network.retry.*: the other remote resource operations.
systemProp.org.gradle.internal.repository.max.tentatives=6
systemProp.org.gradle.internal.repository.initial.backoff=2000
systemProp.org.gradle.internal.network.retry.max.attempts=6
systemProp.org.gradle.internal.network.retry.initial.backOff=2000
